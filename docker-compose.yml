# LearnUp — TAM STACK (repo kökü): frontend + brain (API) + worker + redis.
# Tek komutla her şey:  docker compose up --build
#
# Ön koşul (env dosyaları — hiçbiri commit EDİLMEZ):
#   • learnup-brain/.env   → SUPABASE_*, OPENROUTER_API_KEY ...  (brain/worker RUNTIME)
#   • kök .env             → VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (frontend BUILD-time)
#     (.env.example'ı kopyala: cp .env.example .env)
#
# NOT: Yalnız 'brain' imajı build eder; 'worker' aynı imajı komutla yeniden kullanır.

services:
  # ── Frontend: Vite build → nginx (statik + /api proxy → brain) ──
  frontend:
    build:
      context: ./frontend-v2
      args:
        # PUBLIC değerler kök .env'den gömülür (anon key tarayıcıya inebilir; service_role ASLA).
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_EDGE_FUNCTIONS_BASE_URL: ${VITE_EDGE_FUNCTIONS_BASE_URL:-}
    image: learnup-frontend
    # Port mapping removed: nginx will serve the frontend on host port 3000
    depends_on:
      - brain
    restart: unless-stopped

  # ── Nginx: reverse proxy + static server (serves frontend dist) ──
  nginx:
    image: nginx:1.23-alpine
    depends_on:
      - frontend
      - brain
    ports:
      - "3000:80"    # Host port 3000 -> nginx:80
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-v2/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ── Brain: Bun API (:8080) ──
  brain:
    build: ./learnup-brain
    image: learnup-brain
    command: ["bun", "src/server.ts"]
    ports:
      - "8080:8080"
    env_file:
      - ./learnup-brain/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Worker: Ritim (aynı imaj, farklı komut) ──
  worker:
    image: learnup-brain
    command: ["bun", "src/workers/atolye.worker.ts"]
    env_file:
      - ./learnup-brain/.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      brain:
        condition: service_started
    restart: unless-stopped

  # ── Redis: hot-path (ajan orkestrasyonu) ──
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
