# LearnUp frontend-v2 nginx — statik SPA servis + /api reverse-proxy.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Statik varlıklar (hash'li dosya adları) → uzun cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # /api/* → brain (Bun API). Tek origin → CORS yok.
  location /api/ {
    proxy_pass http://brain:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (/api/chat, Koç sohbeti) için: buffer'lama YOK, bağlantı uzun sürebilir.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection '';
  }

  # SPA fallback — react-router client-side rota'lar F5'te 404 olmasın.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
