user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
 
events {
    worker_connections 1024;
}
 
http {
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=60r/m;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
 
    # ⭐ ÇOK ÖNEMLİ: LLM prompt'ları için body limitini büyük tut!
    client_max_body_size 50M;
 
    # Gzip sıkıştırma (Frontend performansı için şart)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
 
    # Log formatı (debug için)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
 
    # ⭐ LOAD BALANCING: brain + brain2 arasında en az bağlantısı olana yönlendir.
    # brain stateless olduğu için (oturum Redis'te, kalıcı veri Supabase'de)
    # istekler hangi node'a düşerse düşsün tutarlılık bozulmuyor.
    upstream brain_up {
        least_conn;
        server brain:8080  max_fails=3 fail_timeout=10s;
        server brain2:8080 max_fails=3 fail_timeout=10s;
    }
 
    server {
        listen 80;
        server_name _;
 
        root /usr/share/nginx/html;
        index index.html;
 
        # React Router (SPA) desteği
        location / {
            try_files $uri $uri/ /index.html;
        }
 
        # Statik dosyaları önbelleğe al
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
 
        # ⭐ API proxy (GÜNCELLENDİ: Timeout'lar eklendi!)
        location /api/ {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://brain_up/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
 
            # 🚀 Burası hayat kurtarır: LLM 2 dakika sürerse Nginx kesmez!
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffering off;  # Streaming yanıtlar için
        }
 
        # WebSocket (eğer kullanıyorsan)
        location /ws/ {
            proxy_pass http://brain_up/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
 