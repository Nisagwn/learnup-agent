# LearnUp — nginx: statik SPA + /api ters vekil (brain + brain2 yük paylaşımı).
#
# Bu dosya conf.d/ altına mount edilir, yani ana nginx.conf'un `include`'u tarafından
# HTTP bağlamının içine açılır. `limit_req_zone` ve `upstream` bu yüzden burada geçerlidir
# — ayrı bir tam nginx.conf'a taşımak gerekmez (bkz. deploy/nginx/nginx.conf notu).

limit_req_zone $binary_remote_addr zone=mylimit:10m rate=60r/m;

# ── YÜK PAYLAŞIMI ──
# İki node da AKTİF (eskiden brain2 `backup` idi: yalnız brain düştüğünde devreye giriyordu).
#
# ⚠️ least_conn BİLİNÇLİ, round-robin DEĞİL. /api/chat bir SSE akışıdır ve dakikalarca açık
# kalır (proxy_read_timeout 600s). Round-robin istek SAYAR, açık bağlantıyı değil: uzun
# akışlar tek node'da birikirdi. least_conn aktif bağlantıya bakar → SSE yükünü doğru dağıtır.
#
# ⚠️ YAPIŞKAN OTURUM (ip_hash) GEREKMEZ — ve eklenmemelidir. Oturum defteri süreç belleğinde
# değil, ortak Redis db2'dedir (lib/oturum.ts): brain'de sonlandırılan oturum brain2'de de
# kapalıdır. ip_hash, karşılığında hiçbir tutarlılık kazandırmadan yük dengesini bozar.
upstream brain_up {
    least_conn;
    server brain:8080  max_fails=3 fail_timeout=10s;
    server brain2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # LLM istemleri büyük gövde taşıyabilir. NOT: asıl tavan brain'de —
    # express.json({ limit: '1mb' }) (app.ts). Buradaki değer yalnız nginx'in
    # isteği brain'e ulaşmadan 413'le kesmesini engeller.
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite çıktısı içerik-hash'li ad üretir (app-a1b2c3.js) → içerik değişince ad değişir.
    # Bu yüzden `immutable` + 1 yıl güvenli: bayat dosya servis edilemez.
    # index.html bu desene GİRMEZ (yukarıdaki `location /`) — o her zaman taze gelir,
    # yoksa yeni hash'leri gösteren HTML cache'te kalır ve dağıtım görünmezdi.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/ {
        limit_req zone=mylimit burst=10 nodelay;

        # ⚠️ $request_uri ŞART — sondaki slash'lı biçim (`proxy_pass http://brain_up/`)
        # KIRAR. O biçimde nginx location ile eşleşen '/api/' önekini SİLER: brain'e
        # '/v1/chat' gider, oysa router'lar '/api' ve '/api/v1' altına mount edilmiştir
        # (app.ts) → hiçbir yola eşleşmez, notFound → HER istek 404. Yük paylaşımı
        # çalışmaya devam eder, sadece iki node da 404 döndürür.
        proxy_pass http://brain_up$request_uri;

        # ── Devre kesici / failover ──
        # max_fails+fail_timeout pasif sağlık kontrolüdür ve yalnız bağlantı hatası/timeout
        # sayar. proxy_next_upstream VARSAYILANI da 'error timeout'tan ibarettir — yani bu
        # satır olmadan brain 502/503 döndürdüğünde nginx brain2'yi DENEMEZ, hatayı olduğu
        # gibi öğrenciye geçirir.
        #
        # POST güvenliği: `non_idempotent` VERİLMEDİ (bilinçli). nginx varsayılan olarak
        # gövdesi gönderilmiş POST'ları yeniden denemez → /answers çift yazılmaz,
        # /questions/generate çift LLM faturası üretmez.
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # ⚠️ connect KISA, read UZUN — ikisi aynı şey değil.
        # connect = TCP el sıkışması. Buraya 600s yazmak "ölü node'a 10 dakika bağlanmaya
        # çalış" demektir; failover'ı fiilen öldürür. LLM'in düşünme süresi read'de geçer.
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE (/api/chat) ──
        # ⚠️ Connection "" olmalı, 'upgrade' DEĞİL. /api WebSocket taşımaz, SSE taşır;
        # sabit `Connection: upgrade` göndermek upstream keepalive'ını bozar ve isteği
        # olmadığı bir şeye benzetir.
        # proxy_buffering off: token'lar biriktirilmeden akmalı (brain ayrıca
        # X-Accel-Buffering: no gönderiyor — chat.routes.ts).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # NOT: /ws/ bloğu KALDIRILDI. Backend'de WebSocket ucu YOK — tüm gerçek zamanlı akış
    # SSE üzerinden (/api/chat), ajan sonuçları ise polling ile (/api/v1/agents/status/:id).
    # Var olmayan bir yüzeyi konfigürasyonda tutmak, mimariyi yanlış okutur.
}
